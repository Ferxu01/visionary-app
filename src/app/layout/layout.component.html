<div class="layout" [class.layout--sidebar-hidden]="!showSidebar()">
  <!-- Sidebar -->
  <app-sidebar [isDrawerOpen]="isDrawerOpen()" />

  <!-- Content Container -->
  <div class="layout__content">
    <!-- Header / Toolbar -->
    <header class="layout__header">
      <button
        type="button"
        class="layout__icon-button"
        (click)="toggleDrawer()"
        aria-label="Toggle navigation"
      >
        <app-icon name="3-bars" />
      </button>

      <div class="layout__actions">
        <app-theme />
        <app-language />
        <button
          type="button"
          class="layout__icon-button"
          (click)="toggleFullscreen()"
          aria-label="Toggle fullscreen"
        >
          <app-icon [name]="isFullscreenMode() ? 'fullscreen-exit' : 'fullscreen'" />
        </button>
      </div>
    </header>

    <!-- Main View -->
    <main class="layout__main">
      <router-outlet />
      <!-- <app-notification /> -->
    </main>
  </div>
</div>
