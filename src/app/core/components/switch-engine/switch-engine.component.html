<div class="engine-switch">
  <span class="engine-switch__label">
    {{
      (isThreeEngine() ? 'Pages.3dModel.threejsEngine' : 'Pages.3dModel.webglEngine') | transloco
    }}
  </span>
  <label class="engine-switch__toggle">
    <input
      type="checkbox"
      class="engine-switch__input"
      [checked]="engine()"
      (change)="toggleEngine($event)"
    />
    <span class="engine-switch__slider"></span>
  </label>
</div>
