<div class="instructions">
  <!-- Panel desplegable -->
  <div class="instructions__panel" [class.instructions__panel--open]="isOpen()">
    <div class="instructions__grid">
      @for (item of instructions; track item) {
        <div class="instructions__card">
          <div class="instructions__icon-box">
            <img
              style="filter: invert(1)"
              class="instructions__icon"
              [src]="item.icon"
              [alt]="item.labelKey | transloco"
            />
          </div>
          <span class="instructions__label">{{ item.labelKey | transloco }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Trigger button -->
  <button
    type="button"
    class="instructions__toggle-btn"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    [title]="'Pages.3dModel.instructionsTitle' | transloco"
  >
    @if (isOpen()) {
      <!-- Icono X cuando está abierto -->
      <svg
        class="instructions__btn-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    } @else {
      <!-- Icono Info cuando está cerrado -->
      <svg
        class="instructions__btn-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    }
  </button>
</div>
